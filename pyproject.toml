[project]
name = "nse-data-bank"
version = "0.1.0"
description = "NSE Multi-Agent Stock Analysis & Prediction System (deterministic, rule-based - no LLM)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.40",
    "requests>=2.31.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0"
]
